name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifactproof-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      SOURCE_DATE_EPOCH: "946684800"
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run values-free privacy audit
        run: python scripts/privacy_audit.py
      - name: Test privacy-audit canary
        run: python scripts/privacy_audit.py --self-test
      - name: Test privacy-safe source archive canonicalizer
        run: python scripts/canonicalize_sdist.py --self-test
      - name: Run synthetic unit tests
        run: python -m unittest discover -s tests -q

  package-smoke:
    name: Package smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      SOURCE_DATE_EPOCH: "946684800"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Audit the source tree
        run: python scripts/privacy_audit.py
      - name: Build a wheel
        run: python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir wheelhouse .
      - name: Install the wheel without an index
        run: python -m pip install --disable-pip-version-check --no-index --no-deps --force-reinstall --find-links wheelhouse "artifactproof==0.1.0"
      - name: Verify the installed module
        env:
          PYTHONPATH: ""
        run: python -m artifactproof --version
      - name: Verify the installed entry point
        env:
          PYTHONPATH: ""
        run: artifactproof --version

  distributions:
    name: Build and audit distributions
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      SOURCE_DATE_EPOCH: "946684800"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the pinned build frontend
        run: python -m pip install "build==1.3.0"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Canonicalize the source distribution
        run: python scripts/canonicalize_sdist.py --dist-dir dist --output-dir canonical-dist --source-date-epoch 946684800
      - name: Audit the extracted source distribution
        shell: bash
        run: |
          mkdir unpacked
          tar -xzf "$(find canonical-dist -maxdepth 1 -name '*.tar.gz' -print -quit)" -C unpacked
          sdist_dir="$(find unpacked -mindepth 1 -maxdepth 1 -type d -print -quit)"
          python scripts/privacy_audit.py --sdist "$sdist_dir"
          python scripts/privacy_audit.py --sdist --self-test "$sdist_dir"
      - name: Install the wheel without an index
        shell: bash
        run: python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
      - name: Verify installed entry points outside the checkout
        working-directory: /tmp
        run: |
          artifactproof --version
          python -m artifactproof --version
