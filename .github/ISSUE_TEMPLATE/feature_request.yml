name: Feature request
description: Suggest a practical improvement that fits the current security scope.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which workflow is difficult today, and what outcome would help?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected input, result, failure behavior, and platform impact.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Explain any effect on key handling, filenames, paths, archives, or output safety.
    validations:
      required: true
