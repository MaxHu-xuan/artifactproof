[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "artifactproof"
version = "0.1.0"
description = "Offline, hash-bound QA receipts for generated artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = [
  "artifact-integrity",
  "artifact-verification",
  "file-integrity",
  "hmac",
  "offline-verification",
  "powerpoint",
  "quality-assurance",
  "pptx",
  "pptx-validation",
  "receipts",
  "supply-chain-security",
  "tamper-evident",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/MaxHu-xuan/artifactproof"
Repository = "https://github.com/MaxHu-xuan/artifactproof"
Issues = "https://github.com/MaxHu-xuan/artifactproof/issues"
Changelog = "https://github.com/MaxHu-xuan/artifactproof/blob/main/CHANGELOG.md"
Security = "https://github.com/MaxHu-xuan/artifactproof/security/policy"

[project.scripts]
artifactproof = "artifactproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/artifactproof" = ["schema/receipt.schema.json"]
